<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Selfo &mdash; connection board game</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ============================================================ -->
  <!-- TOP BAR : title + persistent game id                          -->
  <!-- ============================================================ -->
  <header class="topbar">
    <div class="topbar-left">
      <div class="brand">
        <span class="brand-hex">&#x2B22;</span>
        <span class="brand-text">SELF<span class="brand-accent">O</span></span>
      </div>
      <div class="game-id-wrap">
        <span id="gameIdValue" class="game-id-value">&mdash;</span>
        <button id="copyLinkBtn" class="chip-btn" disabled title="Copy invite link">COPY LINK</button>
      </div>
    </div>
    <div class="status-wrap">
      <span id="turnIndicator" class="turn-indicator"></span>
    </div>
  </header>

  <!-- ============================================================ -->
  <!-- MAIN LAYOUT : setup (left/top) | board (center) | options (right/bottom) -->
  <!-- ============================================================ -->
  <main class="layout">

    <!-- ---------------- LEFT / TOP : setup ------------------------- -->
    <section class="panel panel-setup" aria-label="Game setup">

      <!-- start / stop, with the nickname field alongside it — always the
           top control in this panel -->
      <div class="setup-block start-row" id="startBlock" hidden>
        <button id="startGameBtn" class="btn btn-metal-accent" disabled>Start game</button>
        <div class="nickname-inline" id="nicknameBlock" hidden>
          <label class="setup-label" for="nicknameInput">Your nickname</label>
          <input id="nicknameInput" class="text-input" maxlength="18" placeholder="Player" autocomplete="off" />
        </div>
      </div>

      <!-- mode selection -->
      <div class="setup-block" id="modeSelectBlock">
        <label class="setup-label">Mode</label>
        <div class="mode-grid">
          <button class="mode-btn" data-mode="local2p">2 players<br /><small>same device</small></button>
          <button class="mode-btn" data-mode="online2p">2 players<br /><small>online (code)</small></button>
          <button class="mode-btn" data-mode="vscomputer">Vs computer<br /><small>you vs CPU</small></button>
          <button class="mode-btn" data-mode="computerself">Computer vs computer<br /><small>watch CPU play</small></button>
        </div>
      </div>

      <!-- online connection block (create / join) -->
      <div class="setup-block" id="onlineBlock" hidden>
        <label class="setup-label">Connection</label>
        <div class="online-choice">
          <button id="createGameBtn" class="btn btn-metal-sm">Create game</button>
          <button id="joinGameBtn" class="btn btn-metal-sm">Join game</button>
        </div>
        <div id="joinCodeWrap" class="join-code-wrap" hidden>
          <input id="joinCodeInput" class="text-input" placeholder="Enter game code" autocomplete="off" />
          <button id="joinCodeSubmit" class="btn btn-metal-sm">Connect</button>
        </div>
        <div id="onlineStatus" class="online-status"></div>
      </div>

      <!-- color choice (vs computer only) -->
      <div class="setup-block" id="colorChoiceBlock" hidden>
        <label class="setup-label">Play as</label>
        <div class="mode-grid">
          <button class="mode-btn color-btn selected" data-color="black">Black<br /><small>moves first</small></button>
          <button class="mode-btn color-btn" data-color="white">White<br /><small>pie rule</small></button>
        </div>
      </div>

      <!-- board parameters -->
      <div class="setup-block" id="paramsBlock" hidden>
        <label class="setup-label" for="radiusRange">
          Board radius <span class="value-pill" id="radiusValue">3</span>
        </label>
        <input type="range" id="radiusRange" min="2" max="6" step="1" value="3" class="range-input" />

        <label class="setup-label" for="piecesRange">
          Pieces per player <span class="value-pill" id="piecesValue">&mdash;</span>
        </label>
        <input type="range" id="piecesRange" min="1" max="1" step="1" value="1" class="range-input" />

        <fieldset class="cpu-params" id="cpuParamsBlock" disabled>
          <legend>Computer</legend>
          <label class="setup-label" for="cpuTimeRange">
            Max think time (s) <span class="value-pill" id="cpuTimeValue">5</span>
          </label>
          <input type="range" id="cpuTimeRange" min="1" max="30" step="1" value="5" class="range-input" />

          <label class="setup-label" for="cpuDepthRange">
            Moves evaluated ahead <span class="value-pill" id="cpuDepthValue">2</span>
          </label>
          <input type="range" id="cpuDepthRange" min="1" max="5" step="1" value="2" class="range-input" />
        </fieldset>
      </div>
    </section>

    <!-- ---------------- CENTER : the board ------------------------- -->
    <section class="panel panel-board" aria-label="Board">
      <div id="boardScroll" class="board-scroll">
        <svg id="boardSvg" class="board-svg" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
      <div id="boardFlash" class="board-flash-overlay" aria-hidden="true"></div>
    </section>

    <!-- ---------------- RIGHT / BOTTOM : game options --------------- -->
    <section class="panel panel-options" aria-label="Game options">

      <div class="players-box">
        <div class="player-row" id="playerRowBlack">
          <span class="player-swatch swatch-black"></span>
          <span class="player-name" id="playerNameBlack">&mdash;</span>
          <span class="player-you" id="playerYouBlack"></span>
          <span class="player-badge" id="playerBadgeBlack"></span>
        </div>
        <div class="player-row" id="playerRowWhite">
          <span class="player-swatch swatch-white"></span>
          <span class="player-name" id="playerNameWhite">&mdash;</span>
          <span class="player-you" id="playerYouWhite"></span>
          <span class="player-badge" id="playerBadgeWhite"></span>
        </div>
      </div>

      <div class="btn-stack">
        <button id="swapColorBtn" class="btn btn-metal" disabled>Swap colors (pie rule)</button>
        <button id="offerDrawBtn" class="btn btn-metal" disabled>Offer draw</button>
        <button id="resignBtn" class="btn btn-metal btn-danger" disabled>Resign</button>
      </div>

      <div class="btn-stack">
        <button id="newGameBtn" class="btn btn-metal-accent">New game</button>
        <button id="downloadBtn" class="btn btn-metal-accent" disabled>Download</button>
      </div>

      <div id="messageBox" class="message-box" aria-live="polite"></div>
    </section>

  </main>

  <!-- ============================================================ -->
  <!-- FIRST-RUN ONBOARDING OVERLAY                                  -->
  <!-- ============================================================ -->
  <div id="onboardingOverlay" class="overlay" hidden>
    <div class="overlay-card">
      <h2>Welcome to Selfo</h2>
      <p class="onboarding-sub">Connect all of your pieces into a single group to win. Move one piece per turn to an empty neighboring cell — click it, then click (or drag to) the cell you want to move it to.</p>
      <label class="onboarding-check">
        <input type="checkbox" id="onboardingDontShow" />
        No mostrar de nuevo
      </label>
      <button id="onboardingCloseBtn" class="btn btn-metal-accent">Got it</button>
    </div>
  </div>

  <!-- peerjs cdn: only needed for online mode, loaded lazily -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="hexgeometry.js"></script>
  <script src="boardinit.js"></script>
  <script src="aistrategies.js"></script>
  <script src="script.js"></script>
</body>
</html>
