  <main class="layout no-setup-panel no-options-panel">

    <section class="panel panel-setup" aria-label="Game setup" hidden>

      <div class="setup-block" id="onlineBlock" hidden>
        <label class="setup-label">Connection</label>
        <div class="online-choice">
          <button id="createGameBtn" class="btn btn-metal-sm">Create game</button>
          <button id="joinGameBtn" class="btn btn-metal-sm">Join game</button>
        </div>
        <div id="joinCodeWrap" class="join-code-wrap" hidden>
          <input id="joinCodeInput" class="text-input" placeholder="Enter game code" autocomplete="off" />
          <button id="joinCodeSubmit" class="btn btn-metal-sm">Connect</button>
        </div>
        <div id="onlineStatus" class="online-status"></div>
      </div>

      <div id="cpuParamsSetupSlot"></div>

      <div class="setup-block" id="colorChoiceBlock" hidden>
        <label class="setup-label">Play as</label>
        <div class="mode-grid">
          <button class="mode-btn color-btn" data-color="black">Black<br /><small>moves first</small></button>
          <button class="mode-btn color-btn selected" data-color="white">White<br /><small>pie rule</small></button>
        </div>
      </div>
    </section>

    <section class="panel panel-board" aria-label="Board">
      
      <svg id="tableLattice" class="table-lattice" aria-hidden="true" focusable="false"></svg>
      <div id="boardScroll" class="board-scroll">
        <svg id="boardSvg" class="board-svg" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
      <div id="boardFlash" class="board-flash-overlay" aria-hidden="true"></div>
      <div id="boardFadeOverlay" class="board-fade-overlay" aria-hidden="true"></div>

      <div id="compactPlayers" class="compact-players" hidden>
        <div class="compact-side compact-side-left">
          <span id="compactSwatchLeft" class="compact-swatch"></span>
          <div class="compact-icon-col">
            <svg id="compactIconLeft" class="icon-wire compact-mode-icon" viewBox="0 0 16 24" aria-hidden="true" focusable="false"></svg>
            
            <span id="compactYouMarkLeft" class="compact-you-mark" aria-hidden="true"></span>
          </div>
        </div>
        <div class="compact-side-center">
          <button id="compactSwapBtn" class="btn btn-metal-sm compact-swap-btn compact-swap-inactive" type="button" title="Swap colors (Space)" aria-label="Swap colors (Space)">
            <svg class="icon-wire" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" focusable="false">
              <path d="M7 7h12M15.5 3l3.5 4-3.5 4"/>
              <path d="M17 17H5M8.5 21 5 17l3.5-4"/>
            </svg>
          </button>
          
          <button id="compactAbandonBtn" class="btn btn-metal-sm compact-swap-btn compact-abandon-btn compact-swap-inactive" type="button" title="Hand over to the computer" aria-label="Hand over to the computer">
            <svg class="icon-wire" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" focusable="false">
              <path d="M7.5 5l10.5 7-10.5 7z"/>
            </svg>
          </button>
          
          <button id="compactDrawBtn" class="btn btn-metal-sm compact-swap-btn compact-draw-btn compact-swap-inactive" type="button" title="Draw" aria-label="Draw">
            <svg class="icon-wire" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" focusable="false">
              <path d="M6 21V4"/>
              <path d="M6 4.5c3-1.6 5 1.6 8 0s3.5-.6 4-.3v8c-.5-.3-1 .8-4 .3s-5 1.6-8 0"/>
            </svg>
          </button>
          
          <div id="compactSwapHint" class="swap-hint-bubble" aria-hidden="true" hidden>
            <div class="swap-hint-kb">
              <div class="swap-hint-row"><span class="swap-hint-key"></span><span class="swap-hint-key"></span><span class="swap-hint-key"></span><span class="swap-hint-key"></span></div>
              <div class="swap-hint-row"><span class="swap-hint-key"></span><span class="swap-hint-key swap-hint-key-space"></span><span class="swap-hint-key"></span></div>
            </div>
          </div>
        </div>
        <div class="compact-side compact-side-right">
          <div class="compact-icon-col">
            <svg id="compactIconRight" class="icon-wire compact-mode-icon" viewBox="0 0 16 24" aria-hidden="true" focusable="false"></svg>
            <span id="compactYouMarkRight" class="compact-you-mark" aria-hidden="true"></span>
          </div>
          <span id="compactSwatchRight" class="compact-swatch"></span>
        </div>
      </div>

      <div id="challengeBar" class="challenge-bar" hidden aria-hidden="true">
        <div class="challenge-track">
          
          <div class="challenge-segments-wrap">
            <div id="challengeSegments" class="challenge-segments"></div>
          </div>
          <div id="challengeMarker" class="challenge-marker"></div>
          
          <div id="challengeMarkerFx" class="challenge-marker-fx" aria-hidden="true"></div>
        </div>
      </div>

      <div id="difficultyWrap" class="difficulty-wrap" hidden>
        <div class="difficulty-bar" id="difficultyBar" role="group" aria-label="Difficulty level"></div>
        <input type="range" id="difficultyRange" class="difficulty-range-state" min="0" max="0" step="1" value="0" tabindex="-1" aria-hidden="true" autocomplete="off" />
      </div>
    </section>

    <section class="panel panel-options" aria-label="Game options" hidden>

      <div class="players-box">
        <div class="player-row" id="playerRowBlack">
          <span class="player-swatch swatch-black"></span>
          <span class="player-name" id="playerNameBlack">&mdash;</span>
          <span class="edit-icon" id="editIconBlack" title="Click the name to rename yourself" hidden>&#9998;</span>
          <span class="player-you" id="playerYouBlack"></span>
          <span class="player-badge" id="playerBadgeBlack"></span>
        </div>
        <div class="player-row" id="playerRowWhite">
          <span class="player-swatch swatch-white"></span>
          <span class="player-name" id="playerNameWhite">&mdash;</span>
          <span class="edit-icon" id="editIconWhite" title="Click the name to rename yourself" hidden>&#9998;</span>
          <span class="player-you" id="playerYouWhite"></span>
          <span class="player-badge" id="playerBadgeWhite"></span>
        </div>
      </div>

      <div class="btn-stack">
        <button id="swapColorBtn" class="btn btn-metal" disabled>Swap colors (pie rule) · Space</button>
        <button id="offerDrawBtn" class="btn btn-metal" disabled>Offer draw</button>
        <button id="resignBtn" class="btn btn-metal btn-danger" disabled>Resign</button>
      </div>

      <div class="btn-stack">
        <button id="downloadBtn" class="btn btn-metal-accent" disabled>Download</button>
      </div>

      <div id="messageBox" class="message-box" aria-live="polite" hidden></div>
    </section>

  </main>

  <div id="celebrationOverlay" class="overlay celebration-overlay" hidden aria-hidden="true">
    <div id="celebrationBurst" class="celebration-burst"></div>
  </div>

  <div id="onboardingOverlay" class="overlay loading">
    <div class="overlay-card">
      
      <div class="brand onboarding-brand">
        <span class="brand-hex">&#x2B22;</span>
        <span class="brand-text">SELF<span class="brand-accent">O</span></span>
      </div>
      
      <div class="onboarding-demo">
        <svg id="splashBoard" class="board-svg" aria-hidden="true"></svg>
      </div>

      <button id="onboardingSkipBtn" class="chip-btn icon-btn icon-halo onboarding-skip" type="button" role="switch" aria-checked="false" aria-label="Don't show again" title="Don't show again">
        <svg class="icon-wire" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false">
          <path d="M20 12a8 8 0 1 1-2.5-5.8"/>
          <path d="M20 4v4h-4"/>
          <path d="M4 4l16 16"/>
        </svg>
      </button>
      <button id="onboardingCloseBtn" class="btn btn-metal-accent" disabled aria-label="OK">
        <svg class="icon-wire" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
          <path d="M4 12l6 6L20 6" />
        </svg>
      </button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
