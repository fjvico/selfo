<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juego de Mesa Selfo - Online & VS IA</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg-wood: #2c1d11;
      --panel-bg: #f4ebd0;
      --board-bg: #3d2b1f;
      --cell-gray: #808080;
      --cell-stroke: #1a1a1a;
      --accent-gold: #c5a059;
      --text-dark: #2b2118;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Georgia', 'Times New Roman', serif;
      background-color: var(--bg-wood);
      background-image: radial-gradient(circle at center, #3d2817 0%, #1a100a 100%);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 15px;
    }

    .container {
      background: var(--panel-bg);
      border: 8px solid var(--accent-gold);
      border-radius: 12px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
      padding: 20px;
      max-width: 900px;
      width: 100%;
      text-align: center;
    }

    h1 {
      font-size: 2.2rem;
      letter-spacing: 2px;
      margin-bottom: 10px;
      color: #3a220f;
      text-transform: uppercase;
      border-bottom: 2px solid var(--accent-gold);
      padding-bottom: 5px;
    }

    h2 {
      font-size: 1.4rem;
      color: #3a220f;
      margin-bottom: 15px;
    }

    .panel { display: none; }
    .active { display: block; }

    .form-group {
      margin: 15px 0;
      text-align: left;
    }

    label { display: block; font-weight: bold; margin-bottom: 5px; }

    input, select {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #a89270;
      border-radius: 4px;
      background: #fffdf5;
      font-family: inherit;
      font-size: 1rem;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .mode-buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 320px;
      margin: 20px auto;
    }

    button {
      background: #5c3a21;
      color: #f4ebd0;
      border: 2px solid var(--accent-gold);
      padding: 10px 20px;
      font-size: 1rem;
      font-weight: bold;
      font-family: inherit;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 5px;
    }

    button:hover {
      background: #7a4e2c;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }

    .btn-ai { background: #2d5a27; }
    .btn-ai:hover { background: #3d7336; }

    .btn-action {
      padding: 6px 12px;
      font-size: 0.9rem;
      margin-top: 0;
    }

    .btn-draw { background: #2b547e; }
    .btn-draw:hover { background: #3a6898; }

    .btn-secondary { background: #4a5d4e; }
    .btn-secondary:hover { background: #5c7462; }

    .btn-cancel { background: #800000; }
    .btn-cancel:hover { background: #a00000; }

    .game-header {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #e6d7b8;
      padding: 12px 15px;
      border-radius: 6px;
      border: 1px solid #c8b48c;
      margin-bottom: 15px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .action-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .players-list {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .status-box {
      font-size: 1.15rem;
      font-weight: bold;
      color: #3a220f;
    }

    .game-tag {
      font-family: monospace;
      background: #2b2118;
      color: var(--accent-gold);
      padding: 4px 8px;
      border-radius: 4px;
      user-select: all;
    }

    .player-badge {
      display: inline-flex;
      align-items: center;
      padding: 5px 12px;
      border-radius: 4px;
      font-size: 0.95rem;
      font-weight: bold;
    }

    .badge-black {
      background: #1a1a1a;
      color: #f4ebd0;
      border: 1px solid #333;
    }

    .badge-white {
      background: #ffffff;
      color: #2b2118;
      border: 1px solid #888;
    }

    .board-container {
      background: var(--board-bg);
      border-radius: 8px;
      padding: 10px;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: auto;
    }

    svg { user-select: none; }

    .hex {
      fill: var(--cell-gray);
      stroke: var(--cell-stroke);
      stroke-width: 1.5px;
      transition: fill 0.2s;
      cursor: pointer;
    }

    .hex:hover { fill: #999999; }
    .hex.selected { fill: #b39b4d; stroke: #fff; stroke-width: 2.5px; }
    .hex.valid-move { fill: #728c69; stroke: #2e4d23; cursor: pointer; }

    .piece { pointer-events: none; transition: all 0.3s ease; }
    .piece-black { fill: url(#blackPieceGrad); stroke: #000; stroke-width: 1px; }
    .piece-white { fill: url(#whitePieceGrad); stroke: #999; stroke-width: 1px; }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.65);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-content {
      background: var(--panel-bg);
      padding: 30px;
      border-radius: 10px;
      border: 4px solid var(--accent-gold);
      text-align: center;
      max-width: 450px;
      width: 90%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 20px;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>SELFO ONLINE & VS IA</h1>

    <!-- Selección de Modo Inicial -->
    <div id="modePanel" class="panel active">
      <div class="mode-buttons">
        <button onclick="showHostForm()">Crear Partida Online</button>
        <button onclick="showJoinForm()">Unirse a Partida Online</button>
        <button onclick="showAIForm()" class="btn-ai">Jugar contra el Ordenador</button>
      </div>
    </div>

    <!-- Crear Partida Online (Host) -->
    <div id="hostPanel" class="panel">
      <h2>Crear Partida Online (Host)</h2>
      <div class="form-group">
        <label for="hostName">Tu Nickname:</label>
        <input type="text" id="hostName" value="Jugador 1">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="boardRadius">Radio del tablero (1-6):</label>
          <input type="number" id="boardRadius" min="1" max="6" value="3">
        </div>
        <div class="form-group">
          <label for="pieceCount">Fichas por jugador:</label>
          <input type="number" id="pieceCount" min="1" max="10" value="3">
        </div>
      </div>
      <button onclick="createRoom()">Generar Sala y Esperar Jugador</button>
      <button onclick="showModePanel()" class="btn-cancel">Volver</button>
    </div>

    <!-- Esperando Jugador -->
    <div id="waitingPanel" class="panel">
      <h2>Partida Creada</h2>
      <p style="margin: 15px 0;">Comparte este código o enlace con el otro jugador:</p>
      <p>Código: <span id="displayRoomCode" class="game-tag"></span></p>
      <button onclick="copyInviteLink()" style="margin: 15px 0;">Copiar Enlace Directo</button>
      <p><i>Esperando a que el Jugador 2 introduzca su nickname y se conecte...</i></p>
    </div>

    <!-- Unirse a Partida Online (Guest) -->
    <div id="joinPanel" class="panel">
      <h2>Unirse a Partida Online</h2>
      <div class="form-group">
        <label for="guestName">Tu Nickname:</label>
        <input type="text" id="guestName" value="Jugador 2">
      </div>
      <div class="form-group">
        <label for="joinCode">Código de la Sala:</label>
        <input type="text" id="joinCode" placeholder="Ej: SELFO-1234">
      </div>
      <button onclick="joinRoom()">Conectarse a la Partida</button>
      <button onclick="showModePanel()" class="btn-cancel">Volver</button>
    </div>

    <!-- Jugar contra el Ordenador (CPU) -->
    <div id="aiPanel" class="panel">
      <h2>Jugar contra el Ordenador</h2>
      <div class="form-group">
        <label for="aiHumanName">Tu Nickname:</label>
        <input type="text" id="aiHumanName" value="Jugador">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="aiBoardRadius">Radio del tablero (1-6):</label>
          <input type="number" id="aiBoardRadius" min="1" max="6" value="3">
        </div>
        <div class="form-group">
          <label for="aiPieceCount">Fichas por jugador:</label>
          <input type="number" id="aiPieceCount" min="1" max="10" value="4">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="aiDepthInput">Evaluación N (Profundidad):</label>
          <input type="number" id="aiDepthInput" min="1" max="5" value="5">
        </div>
        <div class="form-group">
          <label for="aiTimeInput">Tiempo máx. por turno (seg):</label>
          <input type="number" id="aiTimeInput" min="0.5" max="30" step="0.5" value="10">
        </div>
      </div>
      <div class="form-group">
        <label for="aiColorChoice">Jugar con:</label>
        <select id="aiColorChoice">
          <option value="B">Negras (Empiezas tú)</option>
          <option value="W">Blancas (Empieza el ordenador)</option>
          <option value="R">Aleatorio</option>
        </select>
      </div>
      <button onclick="startAIGame()" class="btn-ai">Empezar Partida contra el Ordenador</button>
      <button onclick="showModePanel()" class="btn-cancel">Volver</button>
    </div>

    <!-- Panel de Juego -->
    <div id="gamePanel" class="panel">
      <div class="game-header">
        <div class="header-top">
          <div>ID: <span id="gameTag" class="game-tag"></span></div>
          <div class="status-box" id="turnStatus"></div>
          <div class="action-buttons">
            <button id="pieBtn" onclick="applyPieRule()" style="display:none;" class="btn-action">Cambiar Color (Pastel)</button>
            <button id="drawBtn" onclick="offerDraw()" style="display:none;" class="btn-action btn-draw">Ofrecer Tablas</button>
            <button id="resignBtn" onclick="resignGame()" style="display:none;" class="btn-action btn-cancel">Abandonar</button>
          </div>
        </div>
        <div class="players-list">
          <span id="blackBadge" class="player-badge badge-black"></span>
          <span id="whiteBadge" class="player-badge badge-white"></span>
        </div>
      </div>
      <div class="board-container">
        <svg id="hexBoard" width="500" height="500">
          <defs>
            <radialGradient id="blackPieceGrad" cx="30%" cy="30%" r="70%">
              <stop offset="0%" stop-color="#555" />
              <stop offset="100%" stop-color="#050505" />
            </radialGradient>
            <radialGradient id="whitePieceGrad" cx="30%" cy="30%" r="70%">
              <stop offset="0%" stop-color="#ffffff" />
              <stop offset="100%" stop-color="#cccccc" />
            </radialGradient>
          </defs>
        </svg>
      </div>
    </div>
  </div>

  <!-- Modal de Fin de Partida -->
  <div id="winModal" class="modal">
    <div class="modal-content">
      <h2 id="winTitle">¡Partida Concluida!</h2>
      <p id="winMessage" style="font-size: 1.25rem; font-weight: bold; margin: 15px 0; color: #2b2118;"></p>
      <div class="modal-buttons">
        <button onclick="closeModal()" class="btn-secondary">Ver Tablero</button>
        <button onclick="location.reload()">Nueva Partida</button>
      </div>
    </div>
  </div>

  <!-- Modal de Oferta de Tablas -->
  <div id="drawOfferModal" class="modal">
    <div class="modal-content">
      <h2>Oferta de Tablas</h2>
      <p id="drawOfferMessage" style="font-size: 1.15rem; margin: 15px 0; color: #2b2118;"></p>
      <div class="modal-buttons">
        <button onclick="respondDraw(true)">Aceptar Tablas</button>
        <button onclick="respondDraw(false)" class="btn-cancel">Rechazar</button>
      </div>
    </div>
  </div>

  <script>
    const HEX_SIZE = 32;
    let maxAiTimeMs = 10000;
    let peer = null;
    let conn = null;
    let isHost = false;
    let gameMode = 'ONLINE'; // 'ONLINE' o 'CPU'
    let myColor = null; // 'B' o 'W'
    let aiColor = null; // 'B' o 'W'
    let aiDepth = 5; // Parámetro N
    let localPlayerName = '';
    let NEIGHBORS_MAP = {}; // Precálculo de adyacencias
    let aiStartTime = 0;
    let aiTimedOut = false;
    let aiNodeCount = 0;

    let config = { radius: 3, pieces: 4 };
    let players = { B: 'Jugador 1', W: 'Jugador 2' };
    let gameState = {
      board: {}, // "q,r" -> 'B' | 'W' | null
      currentTurn: 'B',
      selectedCell: null,
      moveCount: 0,
      pieRuleAvailable: false,
      gameEnded: false,
      winMessageText: ''
    };

    window.addEventListener('DOMContentLoaded', () => {
      const hash = window.location.hash.substring(1);
      if (hash.startsWith('SELFO-')) {
        showJoinForm();
        document.getElementById('joinCode').value = hash;
      }
    });

    function showPanel(panelId) {
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.getElementById(panelId).classList.add('active');
    }

    function showModePanel() { showPanel('modePanel'); }
    function showHostForm() { showPanel('hostPanel'); }
    function showJoinForm() { showPanel('joinPanel'); }
    function showAIForm() { showPanel('aiPanel'); }

    function axialKey(q, r) { return `${q},${r}`; }

    function initNeighborsMap() {
      NEIGHBORS_MAP = {};
      const keys = Object.keys(gameState.board);
      const dirs = [[1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1]];
      keys.forEach(k => {
        const [q, r] = k.split(',').map(Number);
        NEIGHBORS_MAP[k] = dirs
          .map(([dq, dr]) => axialKey(q + dq, r + dr))
          .filter(nk => gameState.board.hasOwnProperty(nk));
      });
    }

    function getDispersed(count, existing, poolCells) {
      let pool = poolCells.filter(k => !existing.includes(k));
      let selected = [];
      for (let i = 0; i < count; i++) {
        if (!pool.length) break;
        if (!selected.length) {
          let idx = Math.floor(Math.random() * pool.length);
          selected.push(pool.splice(idx, 1)[0]);
        } else {
          let bestKey = pool[0], maxDist = -1;
          for (let cand of pool) {
            let [cq, cr] = cand.split(',').map(Number);
            let minD = Math.min(...selected.map(s => {
              let [sq, sr] = s.split(',').map(Number);
              return (Math.abs(cq - sq) + Math.abs(cq + cr - sq - sr) + Math.abs(cr - sr)) / 2;
            }));
            if (minD > maxDist) { maxDist = minD; bestKey = cand; }
          }
          selected.push(bestKey);
          pool = pool.filter(k => k !== bestKey);
        }
      }
      return selected;
    }

    // --- MODO VS ORDENADOR (IA REEVALUADA ASÍNCRONA) ---

    function startAIGame() {
      gameMode = 'CPU';
      const nameInput = document.getElementById('aiHumanName').value.trim();
      localPlayerName = nameInput || 'Jugador';

      config.radius = parseInt(document.getElementById('aiBoardRadius').value);
      config.pieces = parseInt(document.getElementById('aiPieceCount').value);
      aiDepth = parseInt(document.getElementById('aiDepthInput').value);
      
      const seconds = parseFloat(document.getElementById('aiTimeInput').value) || 10;
      maxAiTimeMs = Math.max(200, seconds * 1000);

      const maxAvailable = (3 * config.radius * (config.radius - 1) + 1) - 1;
      if (config.pieces * 2 > maxAvailable) {
        alert(`Demasiadas fichas. Máximo: ${Math.floor(maxAvailable / 2)} por jugador.`);
        return;
      }

      let choice = document.getElementById('aiColorChoice').value;
      if (choice === 'R') choice = Math.random() < 0.5 ? 'B' : 'W';

      myColor = choice;
      aiColor = (myColor === 'B') ? 'W' : 'B';

      players[myColor] = localPlayerName;
      players[aiColor] = `Ordenador (N=${aiDepth})`;

      gameState.board = {};
      const R = config.radius - 1;
      for (let q = -R; q <= R; q++) {
        const r1 = Math.max(-R, -q - R);
        const r2 = Math.min(R, -q + R);
        for (let r = r1; r <= r2; r++) {
          gameState.board[axialKey(q, r)] = null;
        }
      }

      initNeighborsMap();

      const validCells = Object.keys(gameState.board).filter(k => k !== "0,0");
      const blackKeys = getDispersed(config.pieces, [], validCells);
      const whiteKeys = getDispersed(config.pieces, blackKeys, validCells);

      blackKeys.forEach(k => gameState.board[k] = 'B');
      whiteKeys.forEach(k => gameState.board[k] = 'W');

      gameState.currentTurn = 'B';
      gameState.moveCount = 0;
      gameState.pieRuleAvailable = false;
      gameState.gameEnded = false;
      gameState.winMessageText = '';
      gameState.selectedCell = null;

      document.getElementById('gameTag').innerText = 'VS CPU';
      showPanel('gamePanel');
      updateUI();
      renderBoard();

      if (aiColor === 'B') triggerCPUTurn();
    }

    function getConnectedGroups(boardState, color) {
      const keys = Object.keys(boardState).filter(k => boardState[k] === color);
      if (keys.length === 0) return [];
      const visited = new Set();
      const groups = [];
      for (let i = 0; i < keys.length; i++) {
        const k = keys[i];
        if (!visited.has(k)) {
          let size = 0;
          const queue = [k];
          visited.add(k);
          while (queue.length > 0) {
            const curr = queue.shift();
            size++;
            const neighbors = NEIGHBORS_MAP[curr] || [];
            for (let j = 0; j < neighbors.length; j++) {
              const nk = neighbors[j];
              if (boardState[nk] === color && !visited.has(nk)) {
                visited.add(nk);
                queue.push(nk);
              }
            }
          }
          groups.push(size);
        }
      }
      return groups;
    }

    function evaluateGoodness(boardState, playerColor) {
      const groups = getConnectedGroups(boardState, playerColor);
      if (groups.length === 0) return 0;
      const maxGroupSize = Math.max(...groups);
      
      let adjacencyBonus = 0;
      const keys = Object.keys(boardState).filter(k => boardState[k] === playerColor);
      for (let i = 0; i < keys.length; i++) {
        const neighbors = NEIGHBORS_MAP[keys[i]] || [];
        for (let j = 0; j < neighbors.length; j++) {
          if (boardState[neighbors[j]] === playerColor) {
            adjacencyBonus += 0.05;
          }
        }
      }
      return maxGroupSize + adjacencyBonus;
    }

    function getValidMovesForColor(boardState, color) {
      const moves = [];
      const keys = Object.keys(boardState).filter(k => boardState[k] === color);
      for (let i = 0; i < keys.length; i++) {
        const fromKey = keys[i];
        const neighbors = NEIGHBORS_MAP[fromKey] || [];
        for (let j = 0; j < neighbors.length; j++) {
          const toKey = neighbors[j];
          if (boardState[toKey] === null) {
            moves.push({ fromKey, toKey });
          }
        }
      }
      return moves;
    }

    function quickMoveScore(boardState, move, color) {
      let score = 0;
      const neighbors = NEIGHBORS_MAP[move.toKey] || [];
      for (let i = 0; i < neighbors.length; i++) {
        if (boardState[neighbors[i]] === color) score += 1;
      }
      return score;
    }

    // --- ALGORITMO ASÍNCRONO NO BLOQUEANTE CON PROFUNDIZACIÓN ITERATIVA ---

    async function getBestMoveAIAsync(boardState, maxTargetDepth, targetColor, maxTimeMs) {
      aiStartTime = Date.now();
      aiTimedOut = false;
      aiNodeCount = 0;

      let absoluteBestMove = null;
      const validMoves = getValidMovesForColor(boardState, targetColor);
      if (validMoves.length === 0) return null;
      absoluteBestMove = validMoves[0]; // Respaldo por defecto

      // Profundización iterativa: evalúa nivel 1, luego 2, 3... hasta maxTargetDepth
      for (let currDepth = 1; currDepth <= maxTargetDepth; currDepth++) {
        if (aiTimedOut) break;

        let alpha = -Infinity;
        let beta = Infinity;
        let moves = getValidMovesForColor(boardState, targetColor);
        moves.sort((a, b) => quickMoveScore(boardState, b, targetColor) - quickMoveScore(boardState, a, targetColor));

        let depthBestMove = moves[0];
        let maxEval = -Infinity;

        for (let i = 0; i < moves.length; i++) {
          // Desahogo periódico del navegador (evita que la pestaña marque 'Sin respuesta')
          aiNodeCount++;
          if (aiNodeCount % 150 === 0) {
            if (Date.now() - aiStartTime > maxTimeMs) aiTimedOut = true;
            await new Promise(resolve => setTimeout(resolve, 0));
          }

          if (aiTimedOut) break;

          const move = moves[i];
          boardState[move.fromKey] = null;
          boardState[move.toKey] = targetColor;

          const oppColor = (targetColor === 'B') ? 'W' : 'B';
          const evalRes = await minimaxRecursiveAsync(boardState, currDepth - 1, false, alpha, beta, oppColor, targetColor, maxTimeMs);

          boardState[move.fromKey] = targetColor;
          boardState[move.toKey] = null;

          if (aiTimedOut) break;

          if (evalRes.score > maxEval) {
            maxEval = evalRes.score;
            depthBestMove = move;
          }
          alpha = Math.max(alpha, evalRes.score);
        }

        // Si la profundidad actual terminó sin agotamiento de tiempo, guardamos el resultado como definitivo
        if (!aiTimedOut) {
          absoluteBestMove = depthBestMove;
          if (maxEval >= 9000) break; // Victoria garantizada encontrada
        }
      }

      return absoluteBestMove;
    }

    async function minimaxRecursiveAsync(boardState, depth, isMaximizing, alpha, beta, currentTurnColor, targetAiColor, maxTimeMs) {
      aiNodeCount++;
      if (aiNodeCount % 150 === 0) {
        if (Date.now() - aiStartTime > maxTimeMs) {
          aiTimedOut = true;
        }
        await new Promise(resolve => setTimeout(resolve, 0));
      }

      const oppColor = (targetAiColor === 'B') ? 'W' : 'B';

      if (aiTimedOut) {
        const aiG = evaluateGoodness(boardState, targetAiColor);
        const oppG = evaluateGoodness(boardState, oppColor);
        return { score: aiG - oppG };
      }

      const aiGoodness = evaluateGoodness(boardState, targetAiColor);
      const oppGoodness = evaluateGoodness(boardState, oppColor);

      if (Math.floor(aiGoodness) === config.pieces) return { score: 10000 + depth };
      if (Math.floor(oppGoodness) === config.pieces) return { score: -10000 - depth };

      if (depth === 0) return { score: aiGoodness - oppGoodness };

      const moves = getValidMovesForColor(boardState, currentTurnColor);
      if (moves.length === 0) return { score: aiGoodness - oppGoodness };

      moves.sort((a, b) => quickMoveScore(boardState, b, currentTurnColor) - quickMoveScore(boardState, a, currentTurnColor));

      if (isMaximizing) {
        let maxEval = -Infinity;
        for (let i = 0; i < moves.length; i++) {
          if (aiTimedOut) break;
          const move = moves[i];
          boardState[move.fromKey] = null;
          boardState[move.toKey] = currentTurnColor;

          const evalRes = await minimaxRecursiveAsync(boardState, depth - 1, false, alpha, beta, oppColor, targetAiColor, maxTimeMs);

          boardState[move.fromKey] = currentTurnColor;
          boardState[move.toKey] = null;

          if (aiTimedOut) break;

          if (evalRes.score > maxEval) {
            maxEval = evalRes.score;
          }
          alpha = Math.max(alpha, evalRes.score);
          if (beta <= alpha) break;
        }
        return { score: maxEval };
      } else {
        let minEval = Infinity;
        for (let i = 0; i < moves.length; i++) {
          if (aiTimedOut) break;
          const move = moves[i];
          boardState[move.fromKey] = null;
          boardState[move.toKey] = currentTurnColor;

          const evalRes = await minimaxRecursiveAsync(boardState, depth - 1, true, alpha, beta, targetAiColor, targetAiColor, maxTimeMs);

          boardState[move.fromKey] = currentTurnColor;
          boardState[move.toKey] = null;

          if (aiTimedOut) break;

          if (evalRes.score < minEval) {
            minEval = evalRes.score;
          }
          beta = Math.min(beta, evalRes.score);
          if (beta <= alpha) break;
        }
        return { score: minEval };
      }
    }

    async function triggerCPUTurn() {
      if (gameState.gameEnded || gameState.currentTurn !== aiColor) return;

      document.getElementById('turnStatus').innerText = `Turno: ${players[aiColor]} (Pensando...)`;

      // Pausa ligera para permitir el renderizado del texto "Pensando..."
      await new Promise(resolve => setTimeout(resolve, 50));

      if (gameState.pieRuleAvailable && gameState.moveCount === 1) {
        const blackScore = evaluateGoodness(gameState.board, 'B');
        const whiteScore = evaluateGoodness(gameState.board, 'W');
        if (blackScore > whiteScore) {
          applyPieRule();
          return;
        }
      }

      const boardCopy = { ...gameState.board };
      const bestMove = await getBestMoveAIAsync(boardCopy, aiDepth, aiColor, maxAiTimeMs);

      if (bestMove) {
        const { fromKey, toKey } = bestMove;
        gameState.board[fromKey] = null;
        gameState.board[toKey] = aiColor;
        gameState.moveCount++;

        const isPieAvail = (gameState.moveCount === 1);
        const winner = checkWin(aiColor) ? aiColor : null;
        const nextTurn = aiColor === 'B' ? 'W' : 'B';

        gameState.currentTurn = nextTurn;
        gameState.pieRuleAvailable = isPieAvail;
        gameState.selectedCell = null;

        if (winner) {
          gameState.gameEnded = true;
          const winnerName = players[winner];
          const winnerColorText = winner === 'B' ? 'Negras' : 'Blancas';
          gameState.winMessageText = `¡Ha ganado ${winnerName} (${winnerColorText})!`;
          renderBoard();
          updateUI();
          showWinModal(gameState.winMessageText);
        } else {
          renderBoard();
          updateUI();
        }
      }
    }

    // --- MODO ONLINE ---

    function createRoom() {
      gameMode = 'ONLINE';
      const nameInput = document.getElementById('hostName').value.trim();
      localPlayerName = nameInput || 'Jugador 1';
      config.radius = parseInt(document.getElementById('boardRadius').value);
      config.pieces = parseInt(document.getElementById('pieceCount').value);

      const maxAvailable = (3 * config.radius * (config.radius - 1) + 1) - 1;
      if (config.pieces * 2 > maxAvailable) {
        alert(`Demasiadas fichas. Máximo: ${Math.floor(maxAvailable / 2)} por jugador.`);
        return;
      }

      isHost = true;
      const roomCode = 'SELFO-' + Math.floor(1000 + Math.random() * 9000);
      document.getElementById('displayRoomCode').innerText = roomCode;
      showPanel('waitingPanel');

      peer = new Peer(roomCode);
      peer.on('connection', (c) => { conn = c; setupHostConnection(); });
      peer.on('error', (err) => alert('Error al crear sala: ' + err));
    }

    function joinRoom() {
      gameMode = 'ONLINE';
      const nameInput = document.getElementById('guestName').value.trim();
      localPlayerName = nameInput || 'Jugador 2';
      const code = document.getElementById('joinCode').value.trim().toUpperCase();
      if (!code) { alert('Introduce un código de sala válido.'); return; }

      isHost = false;
      peer = new Peer();
      peer.on('open', () => { conn = peer.connect(code); setupGuestConnection(); });
      peer.on('error', (err) => alert('No se pudo conectar a la sala. Revisa el código.'));
    }

    function setupHostConnection() {
      conn.on('data', (data) => {
        if (data.type === 'JOIN_REQUEST') initHostGame(data.guestName || 'Jugador 2');
        else handleNetworkMessage(data);
      });
      conn.on('close', () => alert('El otro jugador se ha desconectado.'));
    }

    function setupGuestConnection() {
      conn.on('open', () => sendPayload('JOIN_REQUEST', { guestName: localPlayerName }));
      conn.on('data', (data) => handleNetworkMessage(data));
      conn.on('close', () => alert('El otro jugador se ha desconectado.'));
    }

    function sendPayload(type, payload = {}) {
      if (conn && conn.open) conn.send({ type, ...payload });
    }

    function initHostGame(guestName) {
      gameState.board = {};
      const R = config.radius - 1;
      for (let q = -R; q <= R; q++) {
        const r1 = Math.max(-R, -q - R);
        const r2 = Math.min(R, -q + R);
        for (let r = r1; r <= r2; r++) {
          gameState.board[axialKey(q, r)] = null;
        }
      }

      initNeighborsMap();

      const validCells = Object.keys(gameState.board).filter(k => k !== "0,0");
      const blackKeys = getDispersed(config.pieces, [], validCells);
      const whiteKeys = getDispersed(config.pieces, blackKeys, validCells);

      blackKeys.forEach(k => gameState.board[k] = 'B');
      whiteKeys.forEach(k => gameState.board[k] = 'W');

      const hostIsBlack = Math.random() < 0.5;
      const hostColor = hostIsBlack ? 'B' : 'W';
      const guestColor = hostIsBlack ? 'W' : 'B';

      players[hostColor] = localPlayerName || 'Jugador 1';
      players[guestColor] = guestName || 'Jugador 2';

      const payload = { config, board: gameState.board, players, hostColor, roomCode: peer.id };
      sendPayload('INIT_GAME', payload);
      handleNetworkMessage({ type: 'INIT_GAME', ...payload });
    }

    function handleNetworkMessage(data) {
      switch (data.type) {
        case 'INIT_GAME':
          config = data.config;
          gameState.board = data.board;
          players = data.players;
          gameState.currentTurn = 'B';
          gameState.moveCount = 0;
          gameState.pieRuleAvailable = false;
          gameState.gameEnded = false;
          gameState.winMessageText = '';
          myColor = isHost ? data.hostColor : (data.hostColor === 'B' ? 'W' : 'B');
          initNeighborsMap();

          document.getElementById('gameTag').innerText = data.roomCode;
          showPanel('gamePanel');
          updateUI();
          renderBoard();
          break;

        case 'SYNC_MOVE':
          gameState.board[data.fromKey] = null;
          gameState.board[data.toKey] = data.piece;
          gameState.currentTurn = data.nextTurn;
          gameState.moveCount = data.moveCount;
          gameState.pieRuleAvailable = data.pieRuleAvailable;
          gameState.selectedCell = null;

          if (data.winner) {
            gameState.gameEnded = true;
            const winnerName = players[data.winner] || 'Jugador';
            const winnerColorText = data.winner === 'B' ? 'Negras' : 'Blancas';
            gameState.winMessageText = `¡Ha ganado ${winnerName} (${winnerColorText})!`;
            renderBoard();
            updateUI();
            showWinModal(gameState.winMessageText);
          } else {
            renderBoard();
            updateUI();
          }
          break;

        case 'SYNC_PIE_RULE':
          const tempP = players.B;
          players.B = players.W;
          players.W = tempP;
          myColor = (myColor === 'B') ? 'W' : 'B';
          gameState.currentTurn = 'W';
          gameState.pieRuleAvailable = false;
          renderBoard();
          updateUI();
          break;

        case 'RESIGN':
          gameState.gameEnded = true;
          const winnerColor = data.color === 'B' ? 'W' : 'B';
          const winnerName = players[winnerColor] || 'Jugador';
          const winnerColorText = winnerColor === 'B' ? 'Negras' : 'Blancas';
          gameState.winMessageText = `¡Ha ganado ${winnerName} (${winnerColorText}) por abandono!`;
          renderBoard();
          updateUI();
          showWinModal(gameState.winMessageText);
          break;

        case 'OFFER_DRAW':
          if (data.color !== myColor) {
            const offererName = players[data.color] || 'El otro jugador';
            const offererColorText = data.color === 'B' ? 'Negras' : 'Blancas';
            document.getElementById('drawOfferMessage').innerText = `¡${offererName} (${offererColorText}) te ha ofrecido tablas! ¿Aceptas?`;
            document.getElementById('drawOfferModal').style.display = 'flex';
          }
          break;

        case 'RESPOND_DRAW':
          if (data.accepted) {
            gameState.gameEnded = true;
            gameState.winMessageText = '¡Partida finalizada en Tablas (Empate)!';
            renderBoard();
            updateUI();
            showWinModal(gameState.winMessageText);
          } else {
            if (data.responderColor !== myColor) alert('El otro jugador ha rechazado la oferta de tablas.');
          }
          break;
      }
    }

    // --- ACCIONES DEL JUGADOR ---

    function resignGame() {
      if (gameState.gameEnded) return;
      if (!confirm('¿Estás seguro de que deseas abandonar la partida? Se le dará la victoria al otro jugador.')) return;

      if (gameMode === 'CPU') {
        gameState.gameEnded = true;
        const winnerName = players[aiColor];
        const winnerColorText = aiColor === 'B' ? 'Negras' : 'Blancas';
        gameState.winMessageText = `¡Ha ganado ${winnerName} (${winnerColorText}) por abandono!`;
        renderBoard();
        updateUI();
        showWinModal(gameState.winMessageText);
      } else {
        sendPayload('RESIGN', { color: myColor });
        handleNetworkMessage({ type: 'RESIGN', color: myColor });
      }
    }

    function offerDraw() {
      if (gameState.gameEnded) return;

      if (gameMode === 'CPU') {
        const aiGoodness = evaluateGoodness(gameState.board, aiColor);
        const humanGoodness = evaluateGoodness(gameState.board, myColor);
        if (Math.abs(aiGoodness - humanGoodness) <= 0.5) {
          gameState.gameEnded = true;
          gameState.winMessageText = '¡Partida finalizada en Tablas por acuerdo con el Ordenador!';
          renderBoard();
          updateUI();
          showWinModal(gameState.winMessageText);
        } else {
          alert('El Ordenador rechaza la oferta de tablas y prefiere continuar la partida.');
        }
      } else {
        sendPayload('OFFER_DRAW', { color: myColor });
        alert('Has ofrecido tablas. Esperando respuesta del otro jugador...');
      }
    }

    function respondDraw(accepted) {
      document.getElementById('drawOfferModal').style.display = 'none';
      sendPayload('RESPOND_DRAW', { accepted, responderColor: myColor });
      handleNetworkMessage({ type: 'RESPOND_DRAW', accepted, responderColor: myColor });
    }

    function applyPieRule() {
      if (gameState.currentTurn !== myColor || !gameState.pieRuleAvailable) return;

      if (gameMode === 'CPU') {
        const tempName = players.B;
        players.B = players.W;
        players.W = tempName;

        const tempColor = myColor;
        myColor = aiColor;
        aiColor = tempColor;

        gameState.currentTurn = 'W';
        gameState.pieRuleAvailable = false;

        renderBoard();
        updateUI();

        if (gameState.currentTurn === aiColor) triggerCPUTurn();
      } else {
        sendPayload('SYNC_PIE_RULE');
        handleNetworkMessage({ type: 'SYNC_PIE_RULE' });
      }
    }

    // --- RENDERIZADO Y TABLERO ---

    function renderBoard() {
      const svg = document.getElementById('hexBoard');
      svg.querySelectorAll('.hex, .piece').forEach(e => e.remove());

      const R = config.radius;
      const width = (R * 2 + 1) * HEX_SIZE * 1.75;
      const height = (R * 2 + 1) * HEX_SIZE * 1.5;
      svg.setAttribute('viewBox', `-${width/2} -${height/2} ${width} ${height}`);

      const validMoves = (!gameState.gameEnded && gameState.selectedCell) ? getValidMoves(gameState.selectedCell) : [];

      Object.keys(gameState.board).forEach(key => {
        const [q, r] = key.split(',').map(Number);
        const { x, y } = hexToPixel(q, r);

        const polygon = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
        polygon.setAttribute('points', getHexPoints(x, y, HEX_SIZE));

        let className = 'hex';
        if (gameState.selectedCell === key) className += ' selected';
        else if (validMoves.includes(key)) className += ' valid-move';

        polygon.setAttribute('class', className);
        polygon.onclick = () => handleCellClick(key);
        svg.appendChild(polygon);

        const piece = gameState.board[key];
        if (piece) {
          const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          circle.setAttribute('cx', x);
          circle.setAttribute('cy', y);
          circle.setAttribute('r', HEX_SIZE * 0.65);
          circle.setAttribute('class', `piece piece-${piece === 'B' ? 'black' : 'white'}`);
          svg.appendChild(circle);
        }
      });
    }

    function hexToPixel(q, r) {
      return {
        x: HEX_SIZE * (Math.sqrt(3) * q + Math.sqrt(3)/2 * r),
        y: HEX_SIZE * (3/2 * r)
      };
    }

    function getHexPoints(cx, cy, size) {
      let points = [];
      for (let i = 0; i < 6; i++) {
        const angle = (Math.PI / 180) * (60 * i - 30);
        points.push(`${cx + size * Math.cos(angle)},${cy + size * Math.sin(angle)}`);
      }
      return points.join(' ');
    }

    function handleCellClick(key) {
      if (gameState.gameEnded || gameState.currentTurn !== myColor) return;

      const piece = gameState.board[key];

      if (gameState.selectedCell) {
        const validMoves = getValidMoves(gameState.selectedCell);
        if (validMoves.includes(key)) {
          const fromKey = gameState.selectedCell;
          const pieceColor = gameState.board[fromKey];

          gameState.board[fromKey] = null;
          gameState.board[key] = pieceColor;
          gameState.moveCount++;
          
          const isPieAvail = (gameState.moveCount === 1);
          const winner = checkWin(pieceColor) ? pieceColor : null;
          const nextTurn = gameState.currentTurn === 'B' ? 'W' : 'B';

          if (gameMode === 'CPU') {
            gameState.currentTurn = nextTurn;
            gameState.pieRuleAvailable = isPieAvail;
            gameState.selectedCell = null;

            if (winner) {
              gameState.gameEnded = true;
              const winnerName = players[winner];
              const winnerColorText = winner === 'B' ? 'Negras' : 'Blancas';
              gameState.winMessageText = `¡Ha ganado ${winnerName} (${winnerColorText})!`;
              renderBoard();
              updateUI();
              showWinModal(gameState.winMessageText);
            } else {
              renderBoard();
              updateUI();
              if (gameState.currentTurn === aiColor) triggerCPUTurn();
            }
          } else {
            const moveData = {
              fromKey,
              toKey: key,
              piece: pieceColor,
              nextTurn,
              moveCount: gameState.moveCount,
              pieRuleAvailable: isPieAvail,
              winner
            };
            sendPayload('SYNC_MOVE', moveData);
            handleNetworkMessage({ type: 'SYNC_MOVE', ...moveData });
          }
          return;
        }
      }

      if (piece === myColor) {
        gameState.selectedCell = (gameState.selectedCell === key) ? null : key;
        renderBoard();
      }
    }

    function getValidMoves(key) {
      const neighbors = NEIGHBORS_MAP[key] || [];
      return neighbors.filter(k => gameState.board[k] === null);
    }

    function checkWin(color) {
      const colorPieces = Object.keys(gameState.board).filter(k => gameState.board[k] === color);
      if (colorPieces.length === 0) return false;
      const groups = getConnectedGroups(gameState.board, color);
      return groups.length === 1 && groups[0] === colorPieces.length;
    }

    function updateUI() {
      const blackName = players.B || 'Jugador 1';
      const whiteName = players.W || 'Jugador 2';

      const blackText = myColor === 'B' ? `${blackName} (Tú)` : blackName;
      const whiteText = myColor === 'W' ? `${whiteName} (Tú)` : whiteName;

      document.getElementById('blackBadge').innerText = `⬛ Negras: ${blackText}`;
      document.getElementById('whiteBadge').innerText = `⬜ Blancas: ${whiteText}`;

      const turnStatusEl = document.getElementById('turnStatus');
      const pieBtn = document.getElementById('pieBtn');
      const drawBtn = document.getElementById('drawBtn');
      const resignBtn = document.getElementById('resignBtn');

      if (gameState.gameEnded) {
        turnStatusEl.innerHTML = `<span style="color: #2e7d32;">🏆 ${gameState.winMessageText}</span>`;
        pieBtn.style.display = 'none';
        drawBtn.style.display = 'none';
        resignBtn.style.display = 'none';
        return;
      }

      const currentTurnPlayer = players[gameState.currentTurn] || 'Jugador';
      const colorText = gameState.currentTurn === 'B' ? 'Negras' : 'Blancas';

      turnStatusEl.innerText = `Turno: ${currentTurnPlayer} (${colorText})`;

      drawBtn.style.display = 'inline-block';
      resignBtn.style.display = 'inline-block';

      if (gameState.pieRuleAvailable && gameState.currentTurn === myColor && myColor === 'W') {
        pieBtn.style.display = 'inline-block';
      } else {
        pieBtn.style.display = 'none';
      }
    }

    function showWinModal(msg) {
      document.getElementById('winTitle').innerText = '¡Partida Concluida!';
      document.getElementById('winMessage').innerText = msg;
      document.getElementById('winModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('winModal').style.display = 'none';
    }

    function copyInviteLink() {
      const code = document.getElementById('displayRoomCode').innerText;
      const url = `${window.location.origin}${window.location.pathname}#${code}`;
      navigator.clipboard.writeText(url).then(() => alert('¡Enlace directo copiado al portapapeles!'));
    }
  </script>
